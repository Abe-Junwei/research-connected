<!DOCTYPE html>
<html lang="zh-Hans">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>文现 · Research Connected</title>
		<meta name="description" content="文现 Research Connected：从一篇文献出发，探索文献图谱，整理并导出研究线索。" />
		<link rel="preload" href="./web.js" as="script" />
		<script defer src="./web.js"></script>
		<script>
			(function () {
				try {
					var mode = localStorage.getItem("research-connected-web-theme") || "system";
					var dark = mode === "dark" || (mode !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
					var root = document.documentElement;
					root.classList.add(dark ? "theme-dark" : "theme-light");
					root.style.colorScheme = dark ? "dark" : "light";
					root.style.backgroundColor = dark ? "#1a1d24" : "#ffffff";
				} catch (e) { /* first paint fallback */ }
			})();
		</script>
		<link rel="stylesheet" href="../styles.css?web=1" />
		<style>
			html, body { height: 100%; margin: 0; }
			body { display: flex; flex-direction: column; }
			#app { flex: 1; min-height: 0; }
			.cpo-boot { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px 100px; position: relative; overflow: hidden; text-align: center; font-family: var(--font-interface); background: var(--background-primary); }
			body:has(.cpo-boot) > .cpo-web-chrome { display: none; }
			.cpo-boot-main { width: 100%; max-width: 440px; }
			.cpo-boot-visual { width: 240px; height: 192px; position: relative; display: grid; place-items: center; margin: 0 auto 26px; }
			.cpo-boot-visual::before { content: ""; position: absolute; inset: -24px -12px; border-radius: 50%; background: radial-gradient(ellipse, rgba(138,127,216,.09), transparent 68%); }
			.cpo-boot-orbit { position: absolute; width: 172px; height: 172px; border: 1px solid var(--background-modifier-border); border-radius: 50%; opacity: .42; }
			.cpo-boot-orbit::after { content: ""; position: absolute; inset: -25px; border: 1px solid var(--background-modifier-border); border-radius: inherit; opacity: .5; }
			.cpo-boot-visual svg { position: relative; width: 164px; height: 164px; }
			.cpo-boot-core, .cpo-boot-node { transform-box: fill-box; transform-origin: center; }
			.cpo-boot-core { animation: cpo-boot-breathe 2.8s ease-in-out infinite; }
			.cpo-boot-node { animation: cpo-boot-node 3.6s ease-in-out infinite; animation-delay: var(--node-delay); }
			.cpo-boot-ring { transform-box: view-box; transform-origin: 38% 52%; animation: cpo-boot-ring 2.8s ease-out infinite; }
			.cpo-boot-ring.is-outer { animation-delay: -1.4s; }
			.cpo-boot-flow { stroke: #8a7fd8; stroke-width: 1.4; stroke-linecap: round; stroke-dasharray: 18 82; animation: cpo-boot-flow 3.6s linear infinite; animation-delay: var(--node-delay); }
			@keyframes cpo-boot-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
			@keyframes cpo-boot-node { 0%, 100% { opacity: .55; transform: scale(.95); } 50% { opacity: 1; transform: scale(1.08); } }
			@keyframes cpo-boot-ring { 0% { opacity: .4; transform: scale(.85); } 100% { opacity: 0; transform: scale(1.28); } }
			@keyframes cpo-boot-flow { from { stroke-dashoffset: 18; opacity: .75; } to { stroke-dashoffset: -82; opacity: .75; } }

			.cpo-boot h1 { color: var(--text-normal); margin: 0; font-size: 36px; font-weight: 600; letter-spacing: 5px; text-indent: 5px; line-height: 1.3; }
			.cpo-boot-name { margin: 10px 0 0; color: var(--text-muted); font-size: 11px; letter-spacing: 2.5px; line-height: 1.5; }
			.cpo-boot-subtitle { margin: 12px 0 34px; color: var(--text-muted); font-size: 14px; line-height: 1.7; }
			.cpo-boot-status { margin: 0; color: var(--text-muted); font-size: 12px; letter-spacing: .2px; line-height: 1.6; }
			.cpo-boot-track { width: 160px; height: 3px; margin: 15px auto 0; border-radius: 4px; overflow: hidden; background: var(--background-modifier-border); }
			.cpo-boot-track::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #8a7fd8; animation: cpo-boot-progress 1.8s ease-in-out infinite; }
			.cpo-boot-footer { position: absolute; bottom: 30px; left: 24px; right: 24px; color: var(--text-muted); font-size: 11px; line-height: 1.9; }
			.cpo-boot-footer p { margin: 0; }
			.cpo-boot-footer span { color: var(--text-muted); }
			.cpo-boot noscript p { color: var(--text-muted); font-size: 13px; }
			@keyframes cpo-boot-progress { 0% { transform: translateX(-110%); } 100% { transform: translateX(335%); } }
			@media (max-height: 560px) { .cpo-boot { min-height: 480px; padding-top: 20px; } .cpo-boot-visual { height: 140px; margin-bottom: 20px; } .cpo-boot-orbit { width: 132px; height: 132px; } .cpo-boot-visual svg { width: 132px; height: 132px; } }
			@media (prefers-reduced-motion: reduce) { .cpo-boot-visual svg * { animation: none; } .cpo-boot-flow { display: none; } .cpo-boot-track::after { animation: none; transform: translateX(60%); opacity: .7; } }

			body {
				--background-primary: #ffffff;
				--background-secondary: #f6f5f2;
				--text-normal: #3a3f45;
				--text-muted: #6b7280;
				--text-faint: #9aa0a6;
				--background-modifier-border: #e5e2da;
				--background-modifier-hover: rgba(60, 64, 70, 0.08);
				--background-modifier-box-shadow: rgba(60, 64, 70, 0.14);
				--interactive-accent: #7856c8;
				--interactive-accent-hover: #6a4cb0;
				--graph-node: #5c6570;
				--graph-text: #3a3f45;
				--graph-node-focused: #7856c8;
				--font-interface: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
				background: var(--background-primary);
				color: var(--text-normal);
			}
			html.theme-dark body,
			body.theme-dark {
				--background-primary: #1a1d24;
				--background-secondary: #232833;
				--text-normal: #e6e4df;
				--text-muted: #a8a299;
				--text-faint: #7a756c;
				--background-modifier-border: rgba(255,255,255,.14);
				--background-modifier-hover: rgba(255, 255, 255, 0.08);
				--background-modifier-box-shadow: rgba(0, 0, 0, 0.45);
				--interactive-accent: #a994e8;
				--interactive-accent-hover: #b9a6ee;
				--graph-node: #d5d0c6;
				--graph-text: #e6e4df;
				--graph-node-focused: #a994e8;
				--cpo-canvas-bg-start: #1a1d24;
				--cpo-canvas-bg-end: #12151b;
			}
			.cpo-web-chrome {
				display: flex;
				align-items: center;
				gap: 10px;
				min-width: 0;
				color: var(--text-muted);
				font-size: 11px;
			}
			#app.cpo-root .cpo-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; overflow: visible; }
			#app .cpo-brand { display: flex; flex: none; gap: 0; }
			#app .cpo-brand strong { display: inline; font-size: 16px; font-weight: 600; letter-spacing: 1px; white-space: nowrap; }
			#app .cpo-topline { flex: 0 1 auto; }
			#app .cpo-project-tools { flex: 0 1 auto; }
			.cpo-bar > .cpo-web-chrome { flex: 1 1 280px; }
			#cpo-quota-line { flex: 1 1 160px; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
			.cpo-web-chrome > button, .cpo-privacy-wrap { flex: none; }
			@media (max-width: 640px) {
				#app .cpo-topline, #app .cpo-form { width: 100%; }
				.cpo-bar > .cpo-web-chrome { flex-basis: 100%; }
				#cpo-privacy-info { min-width: 44px; min-height: 44px; }
			}
			.cpo-web-chrome[hidden], #cpo-web-notice[hidden], #cpo-quota-line[hidden],
			#cpo-takeover[hidden], #cpo-cancel-task[hidden], #cpo-privacy-panel[hidden] { display: none !important; }
			#cpo-web-notice[data-kind="error"] { color: #b42318; }
			#app[hidden] { display: none !important; }
			#cpo-web-paper-page .cpo-detail { display: block; }
			.cpo-web-detail { box-sizing: border-box; width: calc(100% - 32px); max-width: 720px; margin: 24px auto; font: 14px/1.5 var(--font-interface); }
			.cpo-web-detail button, .cpo-web-detail > a { min-height: 44px; padding: 8px; }
			.cpo-web-detail .cpo-export-text { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
			.cpo-web-detail h1 { font-size: 1.4rem; color: var(--text-normal); }
			.cpo-icon-btn {
				box-sizing: border-box;
				min-width: 32px;
				min-height: 32px;
				padding: 6px;
				border: 1px solid var(--background-modifier-border);
				border-radius: 10px;
				background: var(--background-primary);
				color: var(--text-normal);
				font: inherit;
				cursor: pointer;
			}
			.cpo-icon-btn:focus-visible {
				outline: 2px solid var(--interactive-accent);
				outline-offset: 2px;
			}
			#cpo-privacy-info, #cpo-privacy-info:hover { min-width: 44px; min-height: 44px; border: 0; background: transparent; box-shadow: none; border-radius: 0; }
			#cpo-privacy-info svg { display: block; }
			#cpo-quota-details { margin: 10px 0 0; }
			#cpo-quota-details p { margin: 6px 0; }
			.cpo-icon-btn[aria-expanded="true"] {
				border-color: var(--interactive-accent);
				color: var(--interactive-accent);
			}
			.cpo-privacy-wrap { position: relative; }
			#cpo-privacy-panel {
				position: absolute;
				right: 0;
				top: calc(100% + 6px);
				z-index: 40;
				width: min(320px, calc(100vw - 24px));
				padding: 12px 14px;
				border: 1px solid var(--background-modifier-border);
				border-radius: 12px;
				background: var(--background-primary);
				color: var(--text-normal);
				box-shadow: 0 10px 28px var(--background-modifier-box-shadow);
				font-size: 13px;
				line-height: 1.5;
			}
			.cpo-theme-toggle {
				position: relative;
				display: grid;
				grid-template-columns: 1fr 1fr;
				align-items: center;
				justify-items: center;
				width: 54px;
				height: 28px;
				padding: 0;
				border: 1px solid var(--background-modifier-border);
				border-radius: 999px;
				background: var(--background-secondary);
				color: var(--text-muted);
				cursor: pointer;
			}
			#cpo-theme-toggle { margin-inline-start: auto; }
			.cpo-theme-toggle::before { content: ""; position: absolute; inset: -8px 0; }
			.cpo-theme-toggle svg { width: 13px; height: 13px; z-index: 1; pointer-events: none; }
			.cpo-theme-sun { color: var(--text-normal); }
			.cpo-theme-toggle[aria-pressed="true"] .cpo-theme-sun { color: var(--text-faint); }
			.cpo-theme-toggle[aria-pressed="true"] .cpo-theme-moon { color: var(--text-normal); }
			.cpo-theme-knob {
				position: absolute; top: 2px; left: 2px; width: 22px; height: 22px;
				box-sizing: border-box; border: 1px solid var(--background-modifier-border);
				border-radius: 50%; background: var(--background-primary); transition: transform 160ms ease;
			}
			.cpo-theme-toggle[aria-pressed="true"] .cpo-theme-knob { transform: translateX(26px); }
			.cpo-theme-toggle:focus-visible { outline: 2px solid var(--interactive-accent); outline-offset: 3px; }
			@media (prefers-reduced-motion: reduce) { .cpo-theme-knob { transition: none; } }
			.cpo-text-btn {
				min-height: 44px;
				padding: 8px 12px;
				border: 1px solid var(--background-modifier-border);
				border-radius: 10px;
				background: var(--background-primary);
				color: var(--text-normal);
				font: inherit;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<div class="cpo-web-chrome" id="cpo-web-chrome">
			<span id="cpo-quota-line" hidden></span>
			<button type="button" id="cpo-takeover" class="cpo-text-btn" hidden>接管编辑</button>
			<button type="button" id="cpo-cancel-task" class="cpo-text-btn" hidden>取消任务</button>
			<button type="button" id="cpo-theme-toggle" class="cpo-theme-toggle" aria-pressed="false" aria-label="切换为深色">
				<i data-lucide="sun" class="cpo-theme-sun" aria-hidden="true"></i>
				<i data-lucide="moon" class="cpo-theme-moon" aria-hidden="true"></i>
				<span class="cpo-theme-knob" aria-hidden="true"></span>
			</button>
			<div class="cpo-privacy-wrap">
				<button
					type="button"
					id="cpo-privacy-info"
					class="cpo-icon-btn"
					aria-expanded="false"
					aria-controls="cpo-privacy-panel"
					aria-label="站点说明与隐私提示"
					title="站点说明与隐私提示"
				><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 11v6"/><path d="M12 7h.01"/></svg></button>
				<div id="cpo-privacy-panel" role="region" aria-labelledby="cpo-privacy-info" hidden>
					<strong>文现 · Research Connected</strong><p>项目只保存在当前浏览器；清除站点数据可能丢失。查询会发送给文献数据源（OpenAlex 等）。</p>
					<div id="cpo-quota-details"><p>全站每日最多500次成功操作，另受数据源剩余额度限制。</p><p>重置时间与剩余预算查询中…</p></div>
				</div>
			</div>
		</div>
		<div id="cpo-web-notice" hidden role="status"></div>
		<div id="app">
			<section class="cpo-boot" aria-label="文现 Research Connected 正在载入" aria-busy="true">
				<div class="cpo-boot-main">
					<div class="cpo-boot-visual" aria-hidden="true"><span class="cpo-boot-orbit"></span><svg aria-hidden="true" focusable="false" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<line stroke="#9ca3af" stroke-width="1.2" x1="38" x2="24" y1="52" y2="28"></line>
<line stroke="#9ca3af" stroke-width="1.2" x1="38" x2="70" y1="52" y2="34"></line>
<line stroke="#9ca3af" stroke-width="1.2" x1="38" x2="76" y1="52" y2="64"></line>
<line stroke="#9ca3af" stroke-width="1.2" x1="38" x2="26" y1="52" y2="76"></line>
<line stroke="#9ca3af" stroke-dasharray="2 2" stroke-width="1.2" x1="70" x2="76" y1="34" y2="64"></line>
<g aria-hidden="true">
<line class="cpo-boot-flow" pathLength="100" style="--node-delay: 0s" x1="38" y1="52" x2="24" y2="28" />
<line class="cpo-boot-flow" pathLength="100" style="--node-delay: -.9s" x1="38" y1="52" x2="70" y2="34" />
<line class="cpo-boot-flow" pathLength="100" style="--node-delay: -1.8s" x1="38" y1="52" x2="76" y2="64" />
<line class="cpo-boot-flow" pathLength="100" style="--node-delay: -2.7s" x1="38" y1="52" x2="26" y2="76" />
</g>
<circle class="cpo-boot-ring" cx="38" cy="52" opacity="0.55" r="12.5" stroke="#8a7fd8" stroke-dasharray="2.5 2" stroke-width="1"></circle>
<circle class="cpo-boot-ring is-outer" cx="38" cy="52" opacity="0.35" r="16" stroke="#8a7fd8" stroke-width="0.85"></circle>
<g class="cpo-boot-core"><circle cx="38" cy="52" fill="#8a7fd8" r="9" stroke="#7265c2" stroke-width="1.2"></circle>
<circle cx="38" cy="52" fill="#FAF8F2" r="2.5"></circle></g>
<g class="cpo-boot-node" style="--node-delay: -.9s"><circle cx="70" cy="34" fill="#4a90d9" r="7.5" stroke="#3877b8" stroke-width="1.2"></circle>
<circle cx="70" cy="34" fill="#FAF8F2" r="2"></circle></g>
<g class="cpo-boot-node" style="--node-delay: 0s"><circle cx="24" cy="28" fill="#8a7fd8" r="5.5" stroke="#7265c2" stroke-width="1"></circle></g>
<g class="cpo-boot-node" style="--node-delay: -1.8s"><circle cx="76" cy="64" fill="#8a7fd8" r="6" stroke="#7265c2" stroke-width="1"></circle></g>
<g class="cpo-boot-node" style="--node-delay: -2.7s"><circle cx="26" cy="76" fill="#8a7fd8" r="5" stroke="#7265c2" stroke-width="1"></circle></g>
</svg></div>
					<h1>文现</h1>
					<p class="cpo-boot-name">RESEARCH CONNECTED</p>
					<p class="cpo-boot-subtitle">从一篇文献，探索研究的关联。</p>
					<p class="cpo-boot-status" role="status">正在载入文献图谱工作台…</p>
					<div class="cpo-boot-track" aria-hidden="true"></div>
					<noscript><p>请启用 JavaScript 后使用图谱工作台。</p></noscript>
				</div>
				<footer class="cpo-boot-footer"><p>项目仅保存在当前浏览器</p><p><span>查询时会访问外部文献数据源</span></p></footer>
			</section>
		</div>
	</body>
</html>
